<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PerifériKo Admin - Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="img/logo_periferiko.jpg">
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card">
      <div class="login-logo-box">
        <img src="img/logo_periferiko.jpg" alt="Logo PerifériKo" class="login-logo-img">
        <div class="logo">Periféri<span>Ko</span></div>
        <p class="subtitle" style="margin-bottom: 0;">Painel Administrativo — Customização Gamer</p>
        </div>

      <div id="feedback-msg" class="alert"></div>

      <form id="form-login" novalidate>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="admin@periferiko.com.br">
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha">
        </div>

        <button type="submit" class="btn btn-primary">Entrar no Painel</button>
      </form>
      <p class="subtitle" style="margin-top: 1rem; font-size: 0.8rem;">
        Acesso Teste: <strong>admin@periferiko.com.br</strong> | Senha: <strong>123456</strong>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
