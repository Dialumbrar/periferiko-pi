<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PerifériKo Admin - Cadastrar Peça</title>
  <link rel="icon" type="image/jpeg" href="img/logo_periferiko.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="brand-header">
      <img src="img/logo_periferiko.jpg" alt="Logo PerifériKo" class="logo-img">
      <div class="logo">Periféri<span>Ko</span> <small>ADMIN</small></div>
    </div>
    <nav>
      <a href="lista.html" class="active">Catálogo de Peças</a>
      <a href="cadastro.html">Novo Componente</a>
      <a href="index.html" id="btn-sair">Sair</a>
    </nav>
  </header>

  <main class="container" style="max-width: 600px;">
    <div class="card">
      <h2>Cadastrar Componente</h2>
      <p class="subtitle">Adicione uma nova peça modular ao catálogo do PerifériKo</p>

      <div id="feedback-msg" class="alert"></div>

      <form id="form-cadastro" novalidate>
        <div class="form-group">
          <label for="nome">Nome do Componente *</label>
          <input type="text" id="nome" placeholder="Ex: Switch Gateron Milky Yellow Pro">
        </div>

        <div class="form-group">
          <label for="categoria">Categoria / Periférico *</label>
          <select id="categoria">
            <option value="">Selecione uma categoria...</option>
            <option value="Teclado - Switches">Teclado Mecânico - Switches</option>
            <option value="Teclado - Keycaps">Teclado Mecânico - Keycaps</option>
            <option value="Mouse - Carcaça/Grips">Mouse Gamer - Carcaça / Grips</option>
            <option value="Mouse - Sensor/Skates">Mouse Gamer - Sensor / Skates</option>
            <option value="Controle - Carcaça/Botões">Controle Console - Carcaça / Botões</option>
            <option value="Controle - Analógicos/Paddles">Controle Console - Analógicos / Paddles</option>
          </select>
        </div>

        <div class="form-group">
          <label for="preco">Preço Unitário (R$) *</label>
          <input type="number" id="preco" step="0.01" placeholder="Ex: 89.90">
        </div>

        <div class="form-group">
          <label for="estoque">Quantidade em Estoque *</label>
          <input type="number" id="estoque" placeholder="Ex: 25">
        </div>

        <button type="submit" class="btn btn-primary">Salvar Componente</button>
      </form>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
